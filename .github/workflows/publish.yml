name: Build & Publish Image

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # The image is named for the product, deliberately decoupled from this repo's
  # name: the artifact ships the server API + the built dashboard, so it is
  # published as ghcr.io/mushroom-pi/mushpi rather than after the packaging repo.
  # The owner is interpolated so an org rename cannot break the name.
  IMAGE_NAME: ${{ github.repository_owner }}/mushpi
  # Second product image: the simulated-units service of the demo stack
  # (Dockerfile.mock → docker-compose.demo.yml → scripts/demo-stack.sh). Same
  # naming convention as IMAGE_NAME: product family, owner interpolated so an
  # org rename cannot break it. Published by build-and-push-mock below.
  MOCK_IMAGE_NAME: ${{ github.repository_owner }}/mushpi-mock

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository (Dockerfile, compose, CI, release manifest)
        uses: actions/checkout@v7

      - name: Checkout mushpi-server into ./mushpi-server
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/mushpi-server
          path: mushpi-server

      - name: Checkout mushpi-client into ./mushpi-client
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/mushpi-client
          path: mushpi-client

      - name: Checkout mushpi-grow into ./mushpi-grow
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/mushpi-grow
          path: mushpi-grow

      - name: Checkout mushpi-mock into ./mushpi-mock
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/mushpi-mock
          path: mushpi-mock

      # ── Release-manifest guard. Runs only on v* tag pushes; fails before
      # anything reaches GHCR if the tag doesn't match release.json at the
      # tagged commit, the manifest is malformed, or the manifest's
      # server/client versions don't match the code this build is about to
      # package (sub-repos are checked out at default-branch HEAD — see
      # `MAINTAINING.md`).
      - name: Verify release manifest (tag ⇔ release.json)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          test -f release.json || { echo "::error::release.json missing at the tagged commit"; exit 1; }
          tag_ver="${GITHUB_REF_NAME#v}"
          rel_ver=$(jq -r .release release.json)
          if [ "$tag_ver" != "$rel_ver" ]; then
            echo "::error::git tag v${tag_ver} != release.json release \"${rel_ver}\""
            exit 1
          fi
          jq -e '
            (.release  | test("^\\d+\\.\\d+\\.\\d+$")) and
            (.server   | test("^\\d+\\.\\d+\\.\\d+$")) and
            (.client   | test("^\\d+\\.\\d+\\.\\d+$")) and
            (.firmware | test("^\\d+\\.\\d+\\.\\d+$")) and
            (.api_version | type == "number" and . >= 1)
          ' release.json > /dev/null \
            || { echo "::error::release.json shape invalid (SemVer strings + integer api_version)"; exit 1; }
          srv_man=$(jq -r .server release.json); srv_act=$(jq -r .version mushpi-server/package.json)
          cli_man=$(jq -r .client release.json); cli_act=$(jq -r .version mushpi-client/package.json)
          if [ "$srv_man" != "$srv_act" ] || [ "$cli_man" != "$cli_act" ]; then
            echo "::error::release.json doesn't match the code being built (server: manifest=${srv_man} actual=${srv_act}; client: manifest=${cli_man} actual=${cli_act}). Were the sub-repo release commits pushed before the tag?"
            exit 1
          fi
          echo "release.json OK: v${tag_ver} = ${srv_act}+${cli_act}, firmware $(jq -r .firmware release.json), api_version $(jq -r .api_version release.json)"

      # ── Bundle-parity check. Runs only on v* tag pushes, after all four
      # sub-repos are checked out. `verify-release.sh` cross-checks the
      # manifest against each sub-repo's committed version (server/client
      # package.json, grow `_SOFTWARE_VERSION` + spec, mock VERSION), so it
      # needs the grow and mock checkouts above.
      - name: Verify bundle parity
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/verify-release.sh "${GITHUB_REF_NAME}"

      # Delegates the mechanical build/push to the shared composite action
      # (.github/actions/build-image). This workflow keeps full ownership of
      # the release tag policy: the tags/flavor blocks below are the whole
      # story of what `latest` means and when it moves.
      - name: Build and push image
        uses: ./.github/actions/build-image
        with:
          registry: ${{ env.REGISTRY }}
          image_name: ${{ env.IMAGE_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          push: 'true'
          # Explicit is identical to metadata-action's default flavor
          # (`latest=auto`): a `v*` tag push still moves `latest` on its own.
          flavor: latest=auto
          # `latest` is bound to `main` by ref, not by the repository's
          # default-branch setting. This repo was born with an unborn `main`,
          # and GitHub makes the first branch pushed the default — so a
          # default-branch-based gate could silently stop applying `latest` on
          # `main` pushes. The explicit ref test cannot be disabled that way.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

  # ── Simulated-unit image for the demo stack ────────────────────────────────
  # Same trigger, registry, token, push and tag/flavor policy as the hub job:
  # a `v*` tag push moves this package's `latest` too, and pushes to `main`
  # republish it — one version story across both product images. Deliberately
  # parallel to build-and-push (no `needs:`): separate packages, separate
  # runner workspaces, nothing shared. Unlike the hub job's tag-gated grow/mock
  # checkouts (parity-check inputs only), the mock checkout here is
  # UNCONDITIONAL — it is this image's build input (Dockerfile.mock COPYs from
  # ./mushpi-mock). The shared context root is filtered for this build by
  # Dockerfile.mock.dockerignore: BuildKit prefers `<dockerfile>.dockerignore`
  # and it then REPLACES the hub-shaped `.dockerignore`, whose exclusions
  # would otherwise starve this build of its only input. No release-manifest
  # guard and no bundle-parity check run here: this image is not the bundle
  # release — scripts/verify-release.sh stays the hub job's.
  build-and-push-mock:
    name: Build & push mock image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository (Dockerfile.mock, CI)
        uses: actions/checkout@v7

      - name: Checkout mushpi-mock into ./mushpi-mock
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/mushpi-mock
          path: mushpi-mock

      # Delegates the mechanical build/push to the shared composite action,
      # which now takes an optional `file` input (default ./Dockerfile — the
      # hub step above omits it and is unaffected). Tag/flavor policy stays
      # owned by THIS caller, exactly like the hub job (see REFERENCE.md).
      - name: Build and push image
        uses: ./.github/actions/build-image
        with:
          registry: ${{ env.REGISTRY }}
          image_name: ${{ env.MOCK_IMAGE_NAME }}
          file: ./Dockerfile.mock
          token: ${{ secrets.GITHUB_TOKEN }}
          push: 'true'
          # Same policy as the hub image — metadata-action default flavor plus
          # the explicit `latest` rule bound to main BY REF, not by the
          # repository's default-branch setting (see the hub job's note).
          flavor: latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
