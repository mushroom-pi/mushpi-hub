# Demo stack — LOCAL-BUILD OVERLAY. Merge it onto docker-compose.demo.base.yml to
# run the demo from the developer's own working copies of mushpi-server,
# mushpi-client and mushpi-mock — uncommitted changes included — with no CI run
# and no registry. Entry point: scripts/demo-stack-local.sh.
#
#   docker compose -f docker-compose.demo.base.yml -f docker-compose.demo-local.yml up
#
# Everything the stack IS (profile, network, mounts, seeding, depends_on) comes
# from the base file, exactly as in the published mode; only the images'
# provenance and the host ports differ, which is the point — a green run here
# says something about the published shape.
#
# Both images are context `..` (the directory holding this repo — the
# orchestration/workspace root, where the sibling repos live as the developer's
# working copies) with `dockerfile:` pointing back into this repo. That is why
# the Dockerfile takes ARG MUSHPI_OPS_PREFIX: from a parent context this repo's
# own files (`release.json`, `scripts/docker-entrypoint.sh`) are one level down.
# The siblings need no prefix — they are direct children of either context root.
#
# Context filtering comes from `Dockerfile.dockerignore` /
# `Dockerfile.mock.dockerignore` — BuildKit prefers `<dockerfile>.dockerignore`
# and then does not read any `.dockerignore`, and a parent context has no
# ignore file of its own, so those two files are what keep `.git`,
# `node_modules` and local runtime state out of the upload. See REFERENCE.md.

services:
  mushpi:
    # Local-only tags: unqualified, so nothing here resolves to a registry —
    # this stack is never pushed and never pulled.
    image: mushpi:demo-local
    build:
      context: ..
      dockerfile: mushpi-ops/Dockerfile
      args:
        MUSHPI_OPS_PREFIX: mushpi-ops

    # Loopback by default, like the published overlay. Port 3000 is the hub's
    # own port too, so a local demo collides with anything already listening
    # there — a hub container, a `yarn start` on the Pi, another checkout's
    # demo — and compose fails on the bind. MUSHPI_DEMO_PORT is the answer; so
    # is stopping whatever holds the port. The container-side port stays 3000.
    ports:
      - "${MUSHPI_DEMO_HOST:-127.0.0.1}:${MUSHPI_DEMO_PORT:-3000}:3000"

  mock:
    image: mushpi-mock:demo-local
    build:
      context: ..
      dockerfile: mushpi-ops/Dockerfile.mock

    # The mock's five host ports are loopback-bound and fixed to match the published overlay — a developer who needs different mock ports edits this file, because the container side must stay 5000-5004 and Compose cannot do arithmetic.
    ports:
      - "127.0.0.1:5000-5004:5000-5004"
