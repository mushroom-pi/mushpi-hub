# Demo stack — PUBLISHED-IMAGE OVERLAY. Merge it onto docker-compose.demo.base.yml;
# it carries nothing but where the two images come from and which host ports are
# published. Entry point: scripts/demo-stack.sh (this is the mode it uses unless
# the local-build wrapper scripts/demo-stack-local.sh is run instead).
#
#   docker compose -f docker-compose.demo.base.yml -f docker-compose.demo.yml up
#
# Published ports bind loopback (127.0.0.1) by default — nothing reaches the LAN
# through this packaging unless MUSHPI_DEMO_HOST is overridden.
#
# State and profile (NODE_ENV=demo, seeding, network, mounts) all live in the
# base file; see its header for the demo's design.

services:
  mushpi:
    # The same published image the hub pulls. No `build:` here — the published
    # demo path mirrors the pull-only deployment by design; a developer's own
    # working copies are the local overlay's job
    # (docker-compose.demo-local.yml).
    image: ghcr.io/mushroom-pi/mushpi:${MUSHPI_IMAGE_TAG:-latest}

    ports:
      - "${MUSHPI_DEMO_HOST:-127.0.0.1}:${MUSHPI_DEMO_PORT:-3000}:3000"

  mock:
    image: ghcr.io/mushroom-pi/mushpi-mock:${MUSHPI_MOCK_IMAGE_TAG:-latest}
    # A laptop that materialized the transient `mushpi-mock/` sibling clone
    # (recipe: REFERENCE.md) builds when the tag is absent locally; a hosted
    # demo keeps pulling — compose builds only a missing image. Stale-tag
    # caveat: if MUSHPI_MOCK_IMAGE_TAG names a tag already present locally,
    # `up` starts it WITHOUT rebuilding (same trap REFERENCE.md records for
    # the hub override) — `pull` or use a fresh tag to force the newer image.
    # Building from the developer's own working copy of mushpi-mock is the local
    # overlay's job, not this file's.
    build:
      context: .
      dockerfile: Dockerfile.mock

    # Loopback-only debugging of the simulated units (GET /, GET /ui) from the
    # laptop; the server reaches the units over the bridge, not via these.
    ports:
      - "127.0.0.1:5000-5004:5000-5004"
