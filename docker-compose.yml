services:
  mushpi:
    image: ghcr.io/mushroom-pi/mushpi:${MUSHPI_IMAGE_TAG:-latest}

    # Developer source build (build context = this repository root; the sibling
    # sub-repos are materialized as transient clones — see REFERENCE.md — so a
    # bare clone has nothing to build):
    #   build:
    #     context: .
    #     args:
    #       VITE_API_BASE_URL: /

    restart: unless-stopped

    network_mode: host

    env_file:
      - .env          # PICO_ANNOUNCE_SECRET

    environment:
      NODE_ENV: prod
      PORT: "3000"
      SQLITE_PATH: /data/app.sqlite
      UPLOAD_DIR: /data
      LOGS_PATH: /data/logs
      APP_HTTPS_ENABLED: ${APP_HTTPS_ENABLED:-false}

    volumes:
      # Persists SQLite DB + uploaded images + logs across restarts/reimages.
      # Host directory is MUSHPI_DATA_DIR (default ./mushpi-data next to this
      # compose file). The container's entrypoint creates it if missing and
      # ensures it is owned by UID 1000 — no manual chown is needed for a
      # first run.
      - "${MUSHPI_DATA_DIR:-./mushpi-data}:/data"
